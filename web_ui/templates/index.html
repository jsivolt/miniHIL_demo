<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battery Simulator Control</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --ink: #17202a;
    --muted: #66717e;
    --line: #dbe1e7;
    --surface: #ffffff;
    --canvas: #eef1f4;
    --blue: #1769aa;
    --green: #247a48;
    --red: #b8323a;
    --amber: #b76e00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: Bahnschrift, Aptos, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .app-header { min-height: 64px; padding: .9rem clamp(1rem, 2vw, 2rem); display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: #18232d; color: #fff; border-bottom: 3px solid #36a269; }
  .app-header h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: 0; }
  .app-header p { margin: .2rem 0 0; color: #b9c5cf; font-size: .78rem; }
  .dashboard { display: grid; grid-template-columns: minmax(260px, 310px) minmax(0, 1fr); gap: 1rem; padding: 1rem; max-width: 1800px; margin: 0 auto; }
  .workspace { min-width: 0; display: grid; gap: 1rem; align-content: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 1px 2px rgba(23, 32, 42, .06); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  .panel-header h2 { margin: 0; font-size: .92rem; font-weight: 650; }
  .panel-body { padding: 1rem; }
  #config-panel { align-self: start; position: sticky; top: 1rem; }
  .config-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem .65rem; }
  .config-grid label { display: block; min-width: 0; margin: 0; font-size: .74rem; color: var(--muted); }
  .config-grid .field-wide { grid-column: 1 / -1; }
  #model-note { display: none; grid-column: 1 / -1; margin: -.35rem 0 0; color: #8a6100; font-size: .7rem; }
  #model-note:not(:empty) { display: block; }
  #paramset-note { grid-column: 1 / -1; margin: -.45rem 0 0; color: var(--muted); font-size: .7rem; }
  input, select { width: 100%; min-height: 36px; margin-top: .3rem; padding: .4rem .55rem; color: var(--ink); background: #fff; border: 1px solid #b8c1ca; border-radius: 4px; }
  input:hover, select:hover { border-color: #7f8d99; }
  input:disabled, select:disabled { color: #7b858e; background: #edf0f2; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin-top: 1rem; }
  button { min-height: 36px; cursor: pointer; padding: .45rem .75rem; border: 0; border-radius: 4px; font-size: .8rem; font-weight: 650; }
  #start-btn { background: var(--green); color: #fff; }
  #stop-btn { background: var(--red); color: #fff; }
  #apply-current-btn { background: var(--blue); color: #fff; }
  button:disabled { background: #aeb6bd !important; cursor: not-allowed; }
  #error-box { display: none; margin-top: .75rem; padding: .65rem .75rem; color: #8f2027; background: #fff0f1; border-left: 3px solid var(--red); border-radius: 3px; font-size: .78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  #error-box:not(:empty) { display: block; }
  .status-badge { display: inline-flex; align-items: center; min-height: 24px; padding: .18rem .65rem; border-radius: 999px; color: #fff; font-size: .72rem; font-weight: 650; text-transform: uppercase; }
  .status-idle { background: #697680; }
  .status-starting { background: var(--amber); }
  .status-running { background: var(--green); }
  .status-stopping { background: #c25d18; }
  .status-error { background: var(--red); }
  .status-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 280px); gap: 1rem; align-items: end; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: .75rem; }
  .stat { min-width: 0; padding-right: .75rem; border-right: 1px solid var(--line); }
  .stat.wide { grid-column: span 2; }
  .stat.wide .stat-value { font-size: .76rem; }
  .stat:last-child { border: 0; }
  .stat-label { display: block; margin-bottom: .22rem; color: var(--muted); font-size: .68rem; text-transform: uppercase; }
  .stat-value { display: block; overflow-wrap: anywhere; font-size: .88rem; font-variant-numeric: tabular-nums; }
  .live-current label { display: block; color: var(--muted); font-size: .72rem; }
  .live-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem; margin-top: .3rem; }
  .live-row input, .live-row button { margin: 0; }
  .chart-panel { min-width: 0; }
  .chart-body { padding: .75rem 1rem 1rem; }
  .chart-controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .6rem; align-items: start; margin-bottom: .65rem; }
  .chart-actions { display: flex; gap: .35rem; }
  .chart-controls button { min-height: 28px; padding: .25rem .55rem; color: #35414c; background: #e8edf1; font-size: .7rem; }
  #cell-checkboxes { display: flex; flex-wrap: wrap; gap: .3rem .55rem; max-height: 56px; overflow-y: auto; padding: .2rem .1rem; }
  .chart-controls label { display: inline-flex; align-items: center; gap: .25rem; margin: 0; color: #3f4a54; font-size: .7rem; white-space: nowrap; }
  .chart-controls input[type=checkbox] { width: auto; min-height: 0; margin: 0; accent-color: var(--cell-color, var(--blue)); }
  .color-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: var(--cell-color); }
  .current-toggle { min-height: 28px; padding: .25rem .5rem; border-left: 1px solid var(--line); }
  .chart-canvas-wrap { position: relative; width: 100%; height: clamp(280px, 36vh, 430px); }
  .cell-grid { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 1px; background: var(--line); }
  .cell-item { min-width: 0; padding: .7rem .8rem; background: #fff; border-left: 3px solid var(--cell-color); }
  .cell-heading { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; margin-bottom: .55rem; }
  .cell-number { font-size: .75rem; font-weight: 650; }
  .cell-voltage { font-size: .9rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .cell-metrics { display: grid; grid-template-columns: 24px minmax(0, 1fr) 42px; gap: .4rem; align-items: center; margin-top: .35rem; }
  .metric-label, .metric-value { color: var(--muted); font-size: .66rem; font-variant-numeric: tabular-nums; }
  .metric-value { text-align: right; }
  .bar-track { width: 100%; height: 5px; overflow: hidden; background: #e8ecef; border-radius: 2px; }
  .bar-fill { height: 100%; background: var(--cell-color, var(--blue)); transition: width .2s linear; }
  .bar-fill.soc { background: var(--green); }
  @media (max-width: 1180px) {
    .stats { grid-template-columns: repeat(3, minmax(110px, 1fr)); }
    .cell-grid { grid-template-columns: repeat(3, minmax(180px, 1fr)); }
  }
  @media (max-width: 900px) {
    .dashboard { grid-template-columns: 1fr; }
    #config-panel { position: static; }
    .config-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .config-grid .field-wide { grid-column: auto; }
    .status-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 680px) {
    .app-header { align-items: flex-start; }
    .app-header p { display: none; }
    .dashboard { padding: .65rem; gap: .65rem; }
    .workspace { gap: .65rem; }
    .config-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chart-controls { grid-template-columns: 1fr auto; }
    #cell-checkboxes { grid-column: 1 / -1; grid-row: 2; max-height: 76px; }
    .cell-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    .chart-canvas-wrap { height: 280px; }
  }
  @media (max-width: 420px) {
    .cell-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div>
    <h1>PyBaMM Battery Simulator</h1>
    <p>Hardware-in-the-loop battery telemetry and control</p>
  </div>
</header>
<div class="dashboard">
  <aside class="panel" id="config-panel">
    <div class="panel-header"><h2>Configuration</h2></div>
    <div class="panel-body">
      <div class="config-grid">
        <label class="field-wide">Cell model
          <select id="cfg-model">
            {% for model in models %}
            <option value="{{ model.id }}" {{ 'selected' if model.id == defaults.model else '' }}>{{ model.label }}</option>
            {% endfor %}
          </select>
        </label>
        <label class="field-wide">Parameter set<select id="cfg-paramset"></select></label>
        <p id="paramset-note"></p>
        <p id="model-note"></p>
        <label class="field-wide">Current (A, positive discharges)<input id="cfg-current" type="number" step="0.1" value="{{ defaults.current_a }}"></label>
        <label>Cell capacity (Ah)<input id="cfg-capacity" type="number" step="0.1" value="{{ defaults.capacity_ah }}"></label>
        <label>Initial SoC (0..1)<input id="cfg-soc" type="number" step="0.01" min="0" max="1" value="{{ defaults.initial_soc }}"></label>
        <label>CAN period (s)<input id="cfg-period" type="number" step="0.01" value="{{ defaults.period }}"></label>
        <label>Random seed<input id="cfg-seed" type="number" step="1" value="{{ defaults.seed }}"></label>
        <label class="field-wide">Interface
          <select id="cfg-interface">
            <option value="virtual" {{ 'selected' if defaults.interface == 'virtual' else '' }}>virtual (no hardware)</option>
            <option value="pcan" {{ 'selected' if defaults.interface == 'pcan' else '' }}>pcan</option>
          </select>
        </label>
        <label class="field-wide">Channel<input id="cfg-channel" type="text" value="{{ defaults.channel }}"></label>
        <label class="field-wide">Bitrate<input id="cfg-bitrate" type="number" step="1000" value="{{ defaults.bitrate }}"></label>
      </div>
      <div class="actions">
        <button id="start-btn">Start</button>
        <button id="stop-btn" disabled>Stop</button>
      </div>
      <div id="error-box" role="alert"></div>
    </div>
  </aside>

  <main class="workspace">
    <section class="panel" id="status-panel">
      <div class="panel-header">
        <h2>System status</h2>
        <span id="status-badge" class="status-badge status-idle">idle</span>
      </div>
      <div class="panel-body status-layout">
        <div class="stats">
          <div class="stat wide"><span class="stat-label">Cell model</span><span class="stat-value" id="stat-model">-</span></div>
          <div class="stat wide"><span class="stat-label">Chemistry</span><span class="stat-value" id="stat-chemistry">-</span></div>
          <div class="stat"><span class="stat-label">Sim time</span><span class="stat-value" id="stat-simtime">-</span></div>
          <div class="stat"><span class="stat-label">Solver rate</span><span class="stat-value" id="stat-hz">-</span></div>
          <div class="stat"><span class="stat-label">CAN overruns</span><span class="stat-value" id="stat-overruns">-</span></div>
          <div class="stat"><span class="stat-label">Pack voltage</span><span class="stat-value" id="stat-pack">-</span></div>
          <div class="stat"><span class="stat-label">Voltage min / mean / max</span><span class="stat-value" id="stat-vrange">-</span></div>
          <div class="stat"><span class="stat-label">Mean SoC</span><span class="stat-value" id="stat-soc">-</span></div>
          <div class="stat"><span class="stat-label">Cutoff cells</span><span class="stat-value" id="stat-exhausted">-</span></div>
        </div>
        <div class="live-current">
          <label for="live-current">Live current override (A)</label>
          <div class="live-row">
            <input id="live-current" type="number" step="0.1" value="{{ defaults.current_a }}">
            <button id="apply-current-btn" disabled>Apply</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel chart-panel">
      <div class="panel-header"><h2>Cell voltage &amp; current vs time</h2></div>
      <div class="chart-body">
        <div class="chart-controls" id="chart-controls">
          <div class="chart-actions">
            <button type="button" id="chart-select-all" title="Show all cell traces">All</button>
            <button type="button" id="chart-select-none" title="Hide all cell traces">None</button>
          </div>
          <span id="cell-checkboxes"></span>
          <label class="current-toggle"><input type="checkbox" id="chart-toggle-current" checked> Current</label>
        </div>
        <div class="chart-canvas-wrap"><canvas id="vi-chart"></canvas></div>
      </div>
    </section>

    <section class="panel cell-panel">
      <div class="panel-header"><h2>Per-cell voltage / SoC</h2></div>
      <div class="cell-grid" id="cell-table-body"></div>
    </section>
  </main>
</div>

<script>
const CELL_COUNT = {{ cell_count }};
const MODELS = {{ models | tojson }};
const PARAMETER_SET_INFO = {{ parameter_set_info | tojson }};
const DEFAULT_PARAMETER_SET = {{ defaults.parameter_set | tojson }};
const startBtn = document.getElementById('start-btn');
const stopBtn = document.getElementById('stop-btn');
const applyCurrentBtn = document.getElementById('apply-current-btn');
const errorBox = document.getElementById('error-box');
const statusBadge = document.getElementById('status-badge');
const modelSelect = document.getElementById('cfg-model');
const paramSetSelect = document.getElementById('cfg-paramset');
const modelNote = document.getElementById('model-note');
const paramSetNote = document.getElementById('paramset-note');

function refreshParameterSetNote() {
  paramSetNote.textContent = PARAMETER_SET_INFO[paramSetSelect.value] || '';
}

function refreshParameterSets() {
  const model = MODELS.find((entry) => entry.id === modelSelect.value);
  paramSetSelect.innerHTML = '';
  model.parameter_sets.forEach((name) => {
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name;
    option.title = PARAMETER_SET_INFO[name] || '';
    option.selected = name === DEFAULT_PARAMETER_SET;
    paramSetSelect.appendChild(option);
  });
  modelNote.textContent = model.realtime ? '' : 'Heaviest model: startup takes longer and the solver rate will drop.';
  refreshParameterSetNote();
}

modelSelect.addEventListener('change', refreshParameterSets);
paramSetSelect.addEventListener('change', refreshParameterSetNote);
refreshParameterSets();

function buildCellRows() {
  const body = document.getElementById('cell-table-body');
  body.innerHTML = '';
  for (let i = 0; i < CELL_COUNT; i++) {
    const item = document.createElement('div');
    item.className = 'cell-item';
    item.style.setProperty('--cell-color', cellColor(i));
    item.innerHTML = `
      <div class="cell-heading">
        <span class="cell-number">Cell ${i + 1}</span>
        <span class="cell-voltage"><span id="v-val-${i}">-</span> V</span>
      </div>
      <div class="cell-metrics">
        <span class="metric-label">Volt</span>
        <div class="bar-track"><div class="bar-fill" id="v-bar-${i}" style="width:0%"></div></div>
        <span class="metric-value">6.55 V</span>
      </div>
      <div class="cell-metrics">
        <span class="metric-label">SoC</span>
        <div class="bar-track"><div class="bar-fill soc" id="soc-bar-${i}" style="width:0%"></div></div>
        <span class="metric-value" id="soc-val-${i}">-</span>
      </div>
    `;
    body.appendChild(item);
  }
}

async function postJSON(url, payload) {
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload || {}),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok === false) {
    throw new Error(data.error || `request to ${url} failed`);
  }
  return data;
}

startBtn.addEventListener('click', async () => {
  errorBox.textContent = '';
  try {
    await postJSON('/api/start', {
      model: modelSelect.value,
      parameter_set: paramSetSelect.value,
      current_a: parseFloat(document.getElementById('cfg-current').value),
      capacity_ah: parseFloat(document.getElementById('cfg-capacity').value),
      initial_soc: parseFloat(document.getElementById('cfg-soc').value),
      period: parseFloat(document.getElementById('cfg-period').value),
      seed: parseInt(document.getElementById('cfg-seed').value, 10),
      interface: document.getElementById('cfg-interface').value,
      channel: document.getElementById('cfg-channel').value,
      bitrate: parseInt(document.getElementById('cfg-bitrate').value, 10),
    });
  } catch (error) {
    errorBox.textContent = error.message;
  }
});

stopBtn.addEventListener('click', async () => {
  errorBox.textContent = '';
  try {
    await postJSON('/api/stop');
  } catch (error) {
    errorBox.textContent = error.message;
  }
});

applyCurrentBtn.addEventListener('click', async () => {
  errorBox.textContent = '';
  try {
    await postJSON('/api/current', { current_a: parseFloat(document.getElementById('live-current').value) });
  } catch (error) {
    errorBox.textContent = error.message;
  }
});

function setStatusBadge(status) {
  statusBadge.textContent = status;
  statusBadge.className = 'status-badge status-' + status;
}

function updateButtons(status) {
  const busy = status === 'starting' || status === 'running';
  startBtn.disabled = busy;
  stopBtn.disabled = !busy;
  applyCurrentBtn.disabled = status !== 'running';
  document.querySelectorAll('#config-panel input, #config-panel select').forEach((el) => { el.disabled = busy; });
}

function fmt(value, digits = 3) {
  return typeof value === 'number' ? value.toFixed(digits) : '-';
}

const MAX_POINTS = 600; // ~5 min of history at the 500ms poll rate

function cellColor(i) {
  return `hsl(${Math.round((360 * i) / CELL_COUNT)}, 70%, 45%)`;
}

const viChart = new Chart(document.getElementById('vi-chart'), {
  type: 'line',
  data: {
    datasets: [
      ...Array.from({ length: CELL_COUNT }, (_, i) => ({
        label: `Cell ${i + 1} V`,
        data: [],
        borderColor: cellColor(i),
        borderWidth: 1,
        pointRadius: 0,
        yAxisID: 'yV',
      })),
      {
        label: 'Current (A)',
        data: [],
        borderColor: '#000',
        borderWidth: 2,
        pointRadius: 0,
        yAxisID: 'yI',
      },
    ],
  },
  options: {
    animation: false,
    parsing: false,
    normalized: true,
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: false },
    scales: {
      x: { type: 'linear', title: { display: true, text: 'Sim time (s)' } },
      yV: { type: 'linear', position: 'left', title: { display: true, text: 'Voltage (V)' } },
      yI: { type: 'linear', position: 'right', title: { display: true, text: 'Current (A)' }, grid: { drawOnChartArea: false } },
    },
    plugins: { legend: { display: false } },
  },
});

let lastSteps = -1;

function buildChartControls() {
  const container = document.getElementById('cell-checkboxes');
  for (let i = 0; i < CELL_COUNT; i++) {
    const label = document.createElement('label');
    label.style.setProperty('--cell-color', cellColor(i));
    label.innerHTML = `<input type="checkbox" data-cell="${i}" checked><span class="color-dot"></span>Cell ${i + 1}`;
    label.querySelector('input').addEventListener('change', (event) => {
      viChart.data.datasets[i].hidden = !event.target.checked;
      viChart.update('none');
    });
    container.appendChild(label);
  }

  document.getElementById('chart-toggle-current').addEventListener('change', (event) => {
    viChart.data.datasets[CELL_COUNT].hidden = !event.target.checked;
    viChart.update('none');
  });

  document.getElementById('chart-select-all').addEventListener('click', () => setAllCellVisibility(true));
  document.getElementById('chart-select-none').addEventListener('click', () => setAllCellVisibility(false));
}

function setAllCellVisibility(visible) {
  document.querySelectorAll('#cell-checkboxes input[type=checkbox]').forEach((checkbox) => {
    checkbox.checked = visible;
  });
  for (let i = 0; i < CELL_COUNT; i++) {
    viChart.data.datasets[i].hidden = !visible;
  }
  viChart.update('none');
}

buildChartControls();

function updateChart(snap) {
  if (snap.steps < lastSteps) {
    viChart.data.datasets.forEach((dataset) => { dataset.data = []; });
  }
  lastSteps = snap.steps;

  viChart.data.datasets.forEach((dataset, i) => {
    const value = i < CELL_COUNT ? snap.voltages[i] : snap.current_a;
    dataset.data.push({ x: snap.sim_time, y: value });
    if (dataset.data.length > MAX_POINTS) dataset.data.shift();
  });
  viChart.update('none');
}

async function poll() {
  try {
    const response = await fetch('/api/status');
    const data = await response.json();
    setStatusBadge(data.status);
    updateButtons(data.status);
    errorBox.textContent = data.error || '';

    const model = MODELS.find((entry) => entry.id === data.params.model);
    document.getElementById('stat-model').textContent =
      `${model ? model.label : data.params.model} / ${data.params.parameter_set}`;
    document.getElementById('stat-chemistry').textContent =
      PARAMETER_SET_INFO[data.params.parameter_set] || '-';

    const snap = data.snapshot;
    if (snap) {
      document.getElementById('stat-simtime').textContent = fmt(snap.sim_time, 1) + ' s';
      document.getElementById('stat-hz').textContent = fmt(snap.steps / Math.max(snap.sim_time, 1e-9), 1) + ' Hz';
      document.getElementById('stat-overruns').textContent = data.overruns;
      document.getElementById('stat-pack').textContent = fmt(snap.pack_voltage) + ' V';
      document.getElementById('stat-vrange').textContent =
        `${fmt(snap.min_voltage)} / ${fmt(snap.mean_voltage)} / ${fmt(snap.max_voltage)}`;
      document.getElementById('stat-soc').textContent = fmt(snap.mean_soc);
      document.getElementById('stat-exhausted').textContent = `${snap.exhausted}/${snap.voltages.length}`;

      updateChart(snap);

      snap.voltages.forEach((voltage, i) => {
        document.getElementById(`v-val-${i}`).textContent = fmt(voltage);
        document.getElementById(`v-bar-${i}`).style.width = Math.min(100, (voltage / 6.5535) * 100) + '%';
      });
      snap.socs.forEach((soc, i) => {
        document.getElementById(`soc-val-${i}`).textContent = fmt(soc);
        document.getElementById(`soc-bar-${i}`).style.width = Math.min(100, Math.max(0, soc * 100)) + '%';
      });
    }
  } catch (error) {
    errorBox.textContent = 'status poll failed: ' + error.message;
  }
}

buildCellRows();
poll();
setInterval(poll, 500);
</script>
</body>
</html>
